name: "Validate devcontainer-feature.json files"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Validate devcontainer-feature.json files"
        uses: devcontainers/action@v1
        with:
          validate-only: "true"
          base-path-to-features: "./src"

  smoke-test:
    name: "Smoke test (${{ matrix.runner }})"
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: "Install @devcontainers/cli"
        run: npm install -g @devcontainers/cli

      # Scope to homebrew-packages while v1.0.1 is unpublished: zsh-setup
      # and neovim-setup pull the published homebrew-packages from GHCR,
      # which is still v1.0.0 (lacks the Linux-sandbox / stdin fixes) and
      # fails on current runner kernels. Drop the filter once v1.0.1 ships.
      - name: "Test all features"
        run: devcontainer features test --features homebrew-packages --base-image mcr.microsoft.com/devcontainers/base:ubuntu .
